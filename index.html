<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Abigail ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contenedor-regalo">
        <h1 class="titulo-principal animate-pop">i love you, <br><span class="nombre">Abigail</span></h1>
        
        <div class="subtitulo-globo animate-float">
            <span>— yes you, my love 🌷 —</span>
        </div>

        <div class="contenedor-gatito">
            <div class="gatito-tierno">
                <div class="orejas"></div>
                <div class="cara">
                    <div class="ojos"></div>
                    <div class="mejillas"></div>
                    <div class="boca"></div>
                </div>
                <div class="corazon-latiente">❤️</div>
                <div class="patitas"></div>
            </div>
        </div>

        <p class="texto-inferior">
            you always try to peek at my phone.<br>
            today? <span class="resaltado">full access. go ahead. 🔓</span>
        </p>

        <button id="btn-sorpresa" class="btn-sorpresa">¡Haz clic aquí, mi amor! ✨</button>
        
               
        <div id="carta-secreta" class="carta-secreta oculta">
            <p>¡Te amo muchísimo! Eres la persona más especial de mi vida. Gracias por estar siempre conmigo. 🐻💖</p>
        </div>

       
        <div id="mensaje-final" class="mensaje-final oculta animate-pop">
            <h2>✨ Eres el amor de mi vida ✨</h2>
        </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
